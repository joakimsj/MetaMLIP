# Template test for the surface-agnostic committee-MACE / PLUMED ALD scaffold.
# Input paths are resolved relative to this YAML file unless absolute.
output_dir: ald_output
random_seed: 123
stop_on_incomplete_phase: True

system:
  slab_file: SiO2_start.traj
  # Repeat the input slab in XY before dynamics; [1, 1] keeps the original cell.
  # Larger supercells increase atom count and computational cost approximately as nx*ny.
  supercell_xy: [1, 1]
  # Optional final cell length along Cartesian z (Angstrom), without scaling atoms.
  # Set null to retain the input cell height. Leave enough vacuum for the precursor.
  cell_z_A: 50
  temperature_K: 500
  timestep_fs: 1.0
  # Fix atoms below this z-coordinate (Angstrom).
  fix_below_z_A: 3.0

committee:
  model_paths:
    - MACE_model_seed_141575.model
    - MACE_model_seed_180730.model
    - MACE_model_seed_926103.model
  device: cuda
  dtype: float64
  head: Default

sampling:
  max_cycles: 3
  max_steps_per_pulse: 15000
  check_interval: 20
  # Initial COM height above the highest slab atom; test higher placements if needed.
  insertion_height_A: 6.0
  insertion_height_step_A: 0.75
  insertion_height_trials: 12
  # For XY-periodic slabs, positions are sampled over the full repeating cell.
  # This range is used only if the slab is not periodic in both XY directions.
  insertion_xy_range_A: 2.0
  insertion_xy_trials: 40
  # Reject placements with any precursor atom closer than this to a slab atom.
  # Generic geometric clash threshold, not a chemistry-specific bond cutoff.
  clash_distance_A: 1.8

uncertainty:
  neighbor_cutoff_A: 5.0
  energy_variance_limit: 0.0015
  local_force_uncertainty_limit: 0.0200
  select_by_energy_variance: false
  select_by_local_force_uncertainty: true

# Molecular connectivity uses periodic ASE neighbor lists and hysteretic
# covalent-radius cutoffs, analogous to scripts/extract_MTD_reactions.py.
# It is used for pulse site inventories by default; set saturation.criterion
# to molecular_graph to use graph edges for precursor completion as well.
# Insertion height is always measured from the highest component connected to
# the dominant initial substrate graph, even if reaction tracking is disabled;
# detached gas-phase molecules/atoms do not raise the insertion reference.
connectivity:
  enabled: true
  form_scale: 1.10
  break_scale: 1.70
  persist_checks: 2
  # Optional chemistry-specific overrides, e.g. {"Si-O": 1.80} in Angstrom.
  pair_cutoffs_A: {}

ald:
  # Purge phases are intentionally blocked until chemistry-aware molecule
  # identification/removal has been implemented and validated.
  sequence: [precursor_A, purge_A, precursor_B, purge_B]

chemistry:
  precursor_A:
    molecule_file: TDMAS_mol.traj
    # Local, zero-based atom index in the precursor template.
    center_index: 0
    # One anchor index per ligand is recommended for ligand-dissociation mode.
    # Verify these indices against the actual TDMAS_mol.traj atom map.
    ligand_indices: [1, 2, 3, 4]

    # PLUMED settings belong to this precursor chemistry. Values are currently
    # initialized from the former shared block and should be validated/tuned.
    plumed:
      surface_r0_A: 2.2
      ligand_r0_A: 2.0
      pace: 300
      height: 4.0
      sigma_surface: 0.15
      sigma_ligand: 0.15
      biasfactor: 8.0
      print_stride: 10
      ligand_lower_wall:
        at: 0.15
        kappa: 150.0

    surface_site_detection:
      enabled: true
      top_layer_tolerance_A: 1.5
      # Candidate surface oxygen atoms; this is a geometric candidate filter,
      # not proof that each oxygen is chemically reactive.
      elements: [O]

    saturation:
      criterion: molecular_graph
      target_surface_bonds: 2
      surface_bond_distance_A: 2.2
      surface_bond_consecutive_checks: 2

    surface_inventory:
      enabled: true
      target_fraction: 0.1
      max_adsorption_attempts: 10
      bond_distance_A: 2.2

  precursor_B:
    molecule_file: H2O_mol.traj
    center_index: 0
    # Verify that these are the intended H ligand-anchor indices in H2O_mol.traj.
    ligand_indices: [1, 2]

    # Independent PLUMED values for this precursor; adjust for oxidants or
    # other chemistries rather than inheriting precursor_A's settings.
    plumed:
      surface_r0_A: 2.2
      ligand_r0_A: 2.0
      pace: 300
      height: 4.0
      sigma_surface: 0.15
      sigma_ligand: 0.15
      biasfactor: 8.0
      print_stride: 10
      ligand_lower_wall:
        at: 0.15
        kappa: 150.0

    surface_site_detection:
      enabled: true
      top_layer_tolerance_A: 1.5
      elements: [O]

    saturation:
      # Requires one persistent O(water)-Si(A) edge and exactly one persistent
      # original O(water)-H edge. Validate geometric graph thresholds chemically.
      criterion: water_oh

    surface_inventory:
      enabled: true
      minimum_waters_per_si: 1
      target_waters_per_si: 2
      max_adsorption_attempts: 20
